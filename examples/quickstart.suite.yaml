name: quickstart-suite
adapter:
  type: http
  url: http://127.0.0.1:18080/agent
  method: POST
  timeout: 10

tests:
  - id: greeting_smoke
    name: Greeting includes hello + safety
    tags: [quickstart, smoke]
    input:
      message: "Say hello and mention safety"
    assertions:
      - type: status_code
        equals: 200
      - type: contains
        value: "hello"
      - type: regex
        pattern: "(?i)safety"
      - type: max_latency_ms
        le: 2000

  - id: json_contract
    name: Response shape is stable for CI and local checks
    tags: [quickstart, contract]
    input:
      message: "Return a safe answer"
    assertions:
      - type: status_code
        equals: 200
      - type: json_path_equals
        path: meta.intent
        equals: "answer"
      - type: not_contains
        value: "traceback"
