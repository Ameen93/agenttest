[project]
name = "agenttest"
version = "0.1.0"
description = "pytest-for-agents: repeatable YAML test suites for AI agent HTTP endpoints"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Ameen" },
]
keywords = ["ai", "agent", "testing", "llm", "evaluation", "yaml", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0.1",
  "requests>=2.32.0",
]

[project.optional-dependencies]
llm-judge = ["anthropic>=0.40.0"]

[project.urls]
Homepage = "https://github.com/Ameen93/agenttest"
Repository = "https://github.com/Ameen93/agenttest"
Issues = "https://github.com/Ameen93/agenttest/issues"

[project.scripts]
agenttest = "agenttest.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
