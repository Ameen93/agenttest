[project]
name = "agenttest"
version = "0.1.0"
description = "pytest-for-agents: repeatable tests for AI agent endpoints"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.1",
  "requests>=2.32.0",
]

[project.scripts]
agenttest = "agenttest.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
