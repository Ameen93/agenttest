<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentTest Business Ops Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>AgentTest Ops Board</h1>
    <p>Jira-style lightweight tracking for sales + delivery.</p>
    <div class="top-actions">
      <button id="addLeadBtn">+ Lead</button>
      <button id="addTaskBtn">+ Task</button>
      <button id="exportBtn">Export JSON</button>
      <label class="import-label">Import JSON
        <input id="importInput" type="file" accept="application/json" />
      </label>
      <button id="resetBtn" class="danger">Reset</button>
    </div>
  </header>

  <section class="metrics" id="metrics"></section>

  <main>
    <section>
      <h2>Sales Pipeline</h2>
      <div class="board" id="pipelineBoard"></div>
    </section>

    <section>
      <h2>Execution Board</h2>
      <div class="board" id="taskBoard"></div>
    </section>
  </main>

  <dialog id="leadDialog">
    <form method="dialog" id="leadForm">
      <h3>Add Lead</h3>
      <label>Company <input name="company" required /></label>
      <label>Contact <input name="contact" /></label>
      <label>Channel
        <select name="channel">
          <option>Email</option><option>LinkedIn</option><option>Referral</option><option>X</option><option>Other</option>
        </select>
      </label>
      <label>Value (ZAR) <input name="value" type="number" min="0" step="100" value="9500" /></label>
      <label>Notes <textarea name="notes"></textarea></label>
      <menu>
        <button value="cancel">Cancel</button>
        <button id="saveLeadBtn" value="default">Save</button>
      </menu>
    </form>
  </dialog>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <h3>Add Task</h3>
      <label>Title <input name="title" required /></label>
      <label>Owner <input name="owner" value="Ameen" /></label>
      <label>Priority
        <select name="priority">
          <option>High</option><option selected>Medium</option><option>Low</option>
        </select>
      </label>
      <label>Due Date <input name="dueDate" type="date" /></label>
      <label>Notes <textarea name="notes"></textarea></label>
      <menu>
        <button value="cancel">Cancel</button>
        <button id="saveTaskBtn" value="default">Save</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
