services:
  agenttest-ops:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    container_name: agenttest-ops
    ports:
      - "8787:8787"
    environment:
      AGENTTEST_OPS_USER: ameen
      AGENTTEST_OPS_PASS: change-this-password
      AGENTTEST_OPS_HOST: 0.0.0.0
      AGENTTEST_OPS_PORT: 8787
    volumes:
      - ./ops.db:/app/ops/ops.db
    restart: unless-stopped
